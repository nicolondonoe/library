<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library</title>
  <script src="script.js" defer></script>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <dialog id="add-book">
    <div class="form-container">
      <form id="new-book" name="newBook">

        <label for="title">Title: </label>
        <input type="text" id="title" name="title">


        <label for="author">Author: </label>
        <input type="text" id="author" name="author">


        <label for="pages">Pages: </label>
        <input type="number" id="pages" name="pages">


        <label for="isRead">Already read? </label>
        <input type="checkbox" id="isRead" name="isRead">

        <button id="closeBtn" type="submit">Add</button>
      </form>
    </div>
  </dialog>

  <div class="wrapper">
    <div class="container">
    </div>
    <div class="button-container"><button class="add-books">Add more books</button></div>
  </div>

</body>

</html>
